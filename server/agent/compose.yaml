# 自宅の GPU サーバー（chris_local）で動かす。秘密情報は同じフォルダの .env から読む。
# Docker の既定のネットワークでは名前解決ができなかったので、ホストのネットワークを使う（外から入る口は開かない）。
services:
  agent:
    build:
      context: .
      network: host
    network_mode: host
    env_file: .env
    environment:
      # シエルの声へ変換する（声質変換サービス server/voice-conversion が同じマシンで動いていること）
      - CIEL_VOICE=ciel
    restart: unless-stopped
