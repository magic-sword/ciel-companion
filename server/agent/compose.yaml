# 自宅の GPU サーバー（chris_local）で動かす。秘密情報は同じフォルダの .env から読む。
# Docker の既定のネットワークでは名前解決ができなかったので、ホストのネットワークを使う（外から入る口は開かない）。
services:
  agent:
    build:
      context: .
      network: host
    network_mode: host
    env_file: .env
    volumes:
      # 編集した設定を、新しい会話から反映する（イメージの再ビルドは不要）。
      - ./config:/app/config:ro
    environment:
      # シエルの声：Irodori-TTS で読み上げる（読み上げサービス server/tts-irodori が同じマシンで動いていること）
      - CIEL_VOICE=irodori
    restart: unless-stopped
