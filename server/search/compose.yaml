name: ciel-search
services:
  search:
    build:
      context: .
      network: host
    network_mode: host
    environment:
      SEARCH_API_TOKEN: ${CIEL_SEARCH_TOKEN:?Set CIEL_SEARCH_TOKEN in server/.env.shared}
      SEARCH_CONTACT: ${SEARCH_CONTACT:?Set public contact in search/.env}
      SEARCH_SOURCE: ${SEARCH_SOURCE:-wikipedia-ja}
      SEARCH_PORT: ${SEARCH_PORT:-8780}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('SEARCH_PORT','8780')+'/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
