# 自宅の GPU サーバーで動かすもの一式。このフォルダ（~/work/ciel-companion/server）で：
#   docker compose up -d --build          会話サーバー・読み上げ・記録の場所（DB）を起動する
#   docker compose --profile vc up -d     声質変換も起動する（読み上げと GPU を分け合うので、ふだんは止めておく）
#   docker compose logs -f agent          会話サーバーのログ
# 秘密情報：agent/.env（OpenAI・LiveKit のキー）と、このフォルダの .env（DB のパスワード CIEL_DB_PASSWORD）。どちらも Git に入れない。
# 会話サーバー・読み上げ・声質変換はホストのネットワークを使う（Docker の既定のネットワークでは名前解決ができなかった）。
# 外から入る口は開かない：読み上げ（8766）・歌を聴く（8767）・声質変換（8765）・DB（5433）は 127.0.0.1 でだけ待ち受ける。
# Docker Compose 2.18 で動かすため、include は使わずにここへまとめて書く。
name: ciel

services:
  # 会話サーバー（server/agent）
  agent:
    build:
      context: ./agent
      network: host
    network_mode: host
    env_file: ./agent/.env
    environment:
      # シエルの声：Irodori-TTS で読み上げる（tts が同じマシンで動いていること）
      - CIEL_VOICE=irodori
      # 会話の組み立て：1 つの音声検出・途中から文字が出る文字起こし・小脳と心（mind.py）。2026-10-31 に realtime から切り替えた
      # （docs/conversation-improvements-2026-10-ja.md）。戻すときは realtime にする
      - CIEL_MODEL=pipeline
      # ゲームの環境（MCP。docs/game-environment-mcp-design-ja.md）。マイクラは体の MCP の入口（server/minecraft の src/ciel/mcp.js）。
      # 会話の始めにつなぎ、アプリの設定「マイクラで一緒に遊ぶ」をオンにした会話だけが体を受け持つ。知識の道具も同じ入口から出る
      - CIEL_GAMES=minecraft=http://127.0.0.1:8771/mcp
      # 覚えている人の記録（speaker_store.py）。開発用も同じ DB を使い、印（main・dev）で分ける（docs/shared-memory-ja.md）
      - CIEL_DB_URL=postgresql://ciel:${CIEL_DB_PASSWORD:?server/.env に CIEL_DB_PASSWORD を書く}@127.0.0.1:5433/ciel
      - CIEL_MEMORY_SCOPE=main
    volumes:
      # 編集した設定を、新しい会話から反映する（イメージの再ビルドは不要）。
      - ./agent/config:/app/config:ro
      # 議事録の下書きを Discord へ送れなかったときの保存先（Git・デプロイの外）
      - ./agent/data/minutes:/app/data/minutes
      # デバッグ用の会話ログ（debug_log.py。ふだんは残さない。scripts/server/debug-log.sh で入れる・取り出す）
      - ./agent/data/debug:/app/data/debug
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 読み上げ（server/tts-irodori）。/data に参照音声とモデルのキャッシュ（Git の外）
  tts:
    build:
      context: ./tts-irodori
      network: host
    network_mode: host
    volumes:
      - ./tts-irodori/data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ローカル LLM（server/local-llm。docs/local-llm-ja.md）。会話サーバーの裏の役目（内なる考え・まとめ・メモなど）が使う。
  # 重み（数十 GB）は Git・デプロイの外の LOCAL_LLM_DIR（既定 ~/models/llm）に置く。ふだんは起動しない（profile local-llm）：
  #   docker compose --profile local-llm up -d local-llm
  # GPU を約 2.6 GB 使う形で動き、歌を聴くあいだだけ CPU だけの形に切り替える（LLM は 127.0.0.1:8094、切り替えの窓口は 127.0.0.1:8095）
  local-llm:
    profiles: [local-llm]
    build:
      context: ./local-llm
      network: host
    network_mode: host
    environment:
      - LOCAL_LLM_MODEL=/models/${LOCAL_LLM_FILE:-Qwen3.5-35B-A3B-Q4_K_M.gguf}
      - LOCAL_LLM_PORT=8094
      - LOCAL_LLM_CONTROL_PORT=8095
      - LOCAL_LLM_CTX=${LOCAL_LLM_CTX:-32768}
      - LOCAL_LLM_PARALLEL=${LOCAL_LLM_PARALLEL:-2}
      - LOCAL_LLM_MODE=${LOCAL_LLM_MODE:-gpu}
    volumes:
      - ${LOCAL_LLM_DIR:-${HOME}/models/llm}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # 歌を聴く（server/singing）。歌声から印象の手がかりを出す。読み上げと GPU を分け合う（約 2 GB）
  singing:
    build:
      context: ./singing
      network: host
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # 声質変換（server/voice-conversion、CIEL_VOICE=ciel のとき）。ふだんは起動しない
  vc:
    profiles: [vc]
    build:
      context: ./voice-conversion
      network: host
    network_mode: host
    volumes:
      - ./voice-conversion/data:/data
      - ./voice-conversion/data/checkpoints:/opt/seed-vc/checkpoints   # Seed-VC がモデルを置く場所（hf_utils.py の ./checkpoints）
    environment:
      - VC_REFERENCE=/data/reference.wav
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # マイクラのサーバー（Java 版。docs/minecraft-design-ja.md）。ふだんは起動しない。
  #   docker compose --env-file .env --env-file .env.minecraft --profile minecraft up -d minecraft minecraft-body
  # シエル用のアカウントを買わないので、アカウントの確認なし（online-mode=false）で動かす。だれでも好きな名前で入れるので、
  # 家の中のネットワークだけで使い、ルーターで 25565 を開かない。入れるのはホワイトリストの人だけ（docs/minecraft-design-ja.md の 12 章）。
  # 世界は ./minecraft/data（Git・デプロイの外）
  minecraft:
    profiles: [minecraft]
    image: itzg/minecraft-server:2026.10.1-java21
    environment:
      - EULA=${MINECRAFT_EULA:-FALSE}   # 利用規約への同意は、利用者が server/.env.minecraft に書く
      - TYPE=VANILLA
      - VERSION=1.21.11                 # 体（Mineflayer 4.39）の MC_VERSION と同じにする
      - ONLINE_MODE=FALSE
      - ENFORCE_SECURE_PROFILE=FALSE
      - ENABLE_WHITELIST=TRUE
      - ENFORCE_WHITELIST=TRUE
      - MEMORY=2G
      - DIFFICULTY=easy
      # スポーンのまわりを、管理者でないプレイヤーにも壊せるようにする（守りは、管理者が 1 人でもいると働く）。
      # 持ち主を管理者にしたら、管理者でないシエルが、スポーンの近くの原木を掘っても元に戻され、空振りした（2026-11-06）
      - SPAWN_PROTECTION=0
    ports:
      # 家の中の IPv4 アドレスだけで開く（server/.env.minecraft の MC_BIND）。自宅サーバーには外から届く IPv6 のアドレスもあるので、
      # 全部のアドレス（0.0.0.0・::）では開かない。書いていなければ、このマシンの中だけ
      - ${MC_BIND:-127.0.0.1}:25565:25565
    volumes:
      - ./minecraft/data:/data
    restart: unless-stopped

  # シエルの体（server/minecraft。マイクラにプレイヤーとして入るボット）。会話サーバーは MCP の http://127.0.0.1:8771/mcp へつなぐ。
  # 以前の ws://127.0.0.1:8768 も、移り終えるまで残す（docs/game-environment-mcp-design-ja.md の 10 章）
  minecraft-body:
    profiles: [minecraft]
    build:
      context: ./minecraft
      network: host
    network_mode: host
    environment:
      - MC_HOST=${MC_BIND:-127.0.0.1}   # マイクラのサーバーを開いたアドレス
      - MC_PORT=25565
      - MC_VERSION=1.21.11
      - MC_USERNAME=Ciel
      - MC_OWNER=${MC_OWNER:-}
      - BODY_HOST=127.0.0.1
      - BODY_PORT=8768
      - CIEL_PORT=8771                  # MCP の入口（src/ciel/mcp.js）。BODY_HOST（このマシンの中）だけで開く
      - EYE_PORT=3007                   # 目（src/eye.js）の視点のページ。BODY_HOST（このマシンの中）だけで開く
      - KNOWLEDGE_DATA=/app/knowledge-data   # 知識の道具（minecraft_search）が読む手元の Wiki
    volumes:
      - ./minecraft/knowledge/data:/app/knowledge-data
    depends_on:
      - minecraft
    restart: unless-stopped

  # マイクラの知識の窓口（MCP。server/minecraft/src/knowledge。docs/game-knowledge-design-ja.md）。体と同じイメージで、別のコンテナ。
  # 会話サーバーは今は体の MCP の入口（:8771）から同じ道具を使うので、ここへはつながない。Wiki を取り出す（下の exec）ために残す。
  # このマシンの中だけで開く
  minecraft-knowledge:
    profiles: [minecraft]
    build:
      context: ./minecraft
      network: host
    image: ciel-minecraft-body
    network_mode: host
    command: ["node", "src/knowledge/main.js"]
    environment:
      - KNOWLEDGE_HOST=127.0.0.1
      - KNOWLEDGE_PORT=8770
      - MC_VERSION=1.21.11
      - KNOWLEDGE_DATA=/app/knowledge-data
    volumes:
      # 手元に取り出した Minecraft Wiki（src/knowledge/wiki-fetch.js。Git・デプロイの外）。取り出すとき：
      #   docker compose --env-file .env --env-file .env.minecraft --profile minecraft exec -d minecraft-knowledge
      #     sh -c 'node src/knowledge/wiki-fetch.js > /app/knowledge-data/fetch.log 2>&1'
      - ./minecraft/knowledge/data:/app/knowledge-data
    restart: unless-stopped

  # 記録の場所（PostgreSQL＋pgvector）。いまは「覚えている人」の名前と声の特徴だけを置く
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      - POSTGRES_USER=ciel
      - POSTGRES_DB=ciel
      - POSTGRES_PASSWORD=${CIEL_DB_PASSWORD:?server/.env に CIEL_DB_PASSWORD を書く}
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ciel -d ciel]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
