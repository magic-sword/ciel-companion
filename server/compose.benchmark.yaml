# Isolated Minecraft benchmark. No production world, DB or Discord destinations.
# Run from server/ with --env-file .env.benchmark -f compose.benchmark.yaml.
name: ciel-minecraft-benchmark
services:
  pointing-init:
    image: itzg/minecraft-server:2026.10.1-java21
    user: '0'
    entrypoint: [sh, -c]
    command: ['mkdir -p /data/ciel-pointing /data/ciel-benchmark-audit && chown 1000:1000 /data/ciel-pointing /data/ciel-benchmark-audit']
    volumes:
      - ./benchmark/data/world:/data
    restart: 'no'
  llm-bench:
    profiles: [local]
    build:
      context: ./local-llm
      network: host
    network_mode: host
    environment:
      LOCAL_LLM_MODEL: /models/${CIEL_BENCH_LLM_FILE:-Qwen3.5-35B-A3B-Q4_K_M.gguf}
      LOCAL_LLM_PORT: '8096'
      LOCAL_LLM_CONTROL_PORT: '8097'
      LOCAL_LLM_CTX: ${CIEL_BENCH_LLM_CTX:-32768}
      LOCAL_LLM_MODE: cpu
      LOCAL_LLM_PARALLEL: '1'
    volumes:
      - ${LOCAL_LLM_DIR:-${HOME}/models/llm}:/models:ro
    restart: 'no'

  minecraft-bench:
    build:
      context: ./minecraft-pointing
      network: host
    depends_on:
      pointing-init:
        condition: service_completed_successfully
    environment:
      EULA: ${MINECRAFT_EULA:-FALSE}
      TYPE: PAPER
      PAPER_BUILD: '132'
      CIEL_POINTING_OWNER: Bench_Owner
      CIEL_BENCH_AUDIT: 'true'
      VERSION: 1.21.11
      LEVEL: ciel-benchmark
      LEVEL_TYPE: FLAT
      GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":126},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","features":false,"lakes":false,"structure_overrides":[]}'
      SEED: '771023'
      ONLINE_MODE: 'FALSE'
      ENFORCE_SECURE_PROFILE: 'FALSE'
      ENABLE_WHITELIST: 'TRUE'
      ENFORCE_WHITELIST: 'TRUE'
      SPAWN_PROTECTION: '0'
      MEMORY: 2G
      ENABLE_RCON: 'TRUE'
      RCON_PASSWORD: ${CIEL_BENCH_RCON_PASSWORD:?Set a dedicated CIEL_BENCH_RCON_PASSWORD}
      RCON_CMDS_STARTUP: |-
        data modify storage ciel_benchmark:meta suite set value "ciel-benchmark-v1"
        gamerule minecraft:advance_time false
        gamerule minecraft:advance_weather false
        gamerule minecraft:spawn_mobs false
        gamerule minecraft:random_tick_speed 0
        gamerule minecraft:immediate_respawn true
        setworldspawn 0 64 0
    ports:
      - 127.0.0.1:25566:25565
      - 127.0.0.1:25576:25575
    volumes:
      - ./benchmark/data/world:/data
      # Offline UUID, as in minecraft/src/whitelist.js; do not resolve an online account.
      - ./benchmark/whitelist.json:/data/whitelist.json:ro
    restart: 'no'

  benchmark-runner:
    profiles: [runner]
    build:
      context: .
      dockerfile: benchmark/Dockerfile
      network: host
    network_mode: host
    env_file:
      - ./.env.shared
      - ./.env.benchmark
    environment:
      CIEL_DB_URL: ''
      CIEL_LLM_BACKEND: local
      CIEL_OPENAI_ROLES: ''
      CIEL_LOCAL_LLM_URL: ${CIEL_BENCH_LLM_URL:-http://127.0.0.1:8094/v1}
      CIEL_BENCH_DISTRACTORS: ${CIEL_BENCH_DISTRACTORS:-0}
      CIEL_BENCH_DISTRACTOR_SURFACE: ${CIEL_BENCH_DISTRACTOR_SURFACE:-both}
      CIEL_BENCH_LLM_SERVICE: ${CIEL_BENCH_LLM_SERVICE:-shared}
      CIEL_BENCH_LLM_URL: ${CIEL_BENCH_LLM_URL:-http://127.0.0.1:8094/v1}
      CIEL_BENCH_LLM_CONTROL: ${CIEL_BENCH_LLM_CONTROL:-http://127.0.0.1:8095}
      CIEL_BENCH_BLOCKED_ACTIONS: ${CIEL_BENCH_BLOCKED_ACTIONS:-}
    volumes:
      - ./benchmark/data:/workspace/server/benchmark/data
      - ./benchmark/data/world/ciel-benchmark-audit:/workspace/server/benchmark/data/audit:ro
      - ./stage1-baseline/source:/stage1-baseline:ro

  body-bench:
    build:
      context: ./minecraft
      network: host
    network_mode: host
    command: [node, benchmark/body-observer.js]
    environment:
      MC_HOST: 127.0.0.1
      MC_PORT: '25566'
      MC_VERSION: 1.21.11
      MC_USERNAME: Ciel_Debug
      MC_OWNER: Bench_Owner
      BODY_HOST: 127.0.0.1
      BODY_PORT: '8772'
      CIEL_PORT: '8773'
      EYE_PORT: '3008'
      KNOWLEDGE_DATA: /app/knowledge-data
      CIEL_POINTING_FILE: /app/pointing/selection.json
      # Body variant under test; the runner records the same value in the manifest.
      CIEL_MINDCRAFT_BLOCKED_ACTIONS: ${CIEL_BENCH_BLOCKED_ACTIONS:-}
    volumes:
      - ./benchmark:/app/benchmark:ro
      - ./benchmark/data/observations:/app/benchmark-data
      - ./benchmark/data/world/ciel-pointing:/app/pointing:ro
      - ${CIEL_BENCH_KNOWLEDGE_DIR:-../../ciel-companion/server/minecraft/knowledge/data}:/app/knowledge-data:ro
    depends_on:
      minecraft-bench:
        condition: service_healthy
    restart: 'no'

  owner-bench:
    build:
      context: ./minecraft
      network: host
    network_mode: host
    command: [node, benchmark/owner.js]
    volumes:
      - ./benchmark:/app/benchmark:ro
      - ./benchmark/data/observations:/app/benchmark-data
    depends_on:
      minecraft-bench:
        condition: service_healthy
    restart: 'no'

  agent-bench:
    profiles: [conversation]
    build:
      context: ./agent
      network: host
    network_mode: host
    command: [python, -m, livekit.agents, start, benchmark/agent_observer.py]
    env_file: ./.env.shared
    environment:
      CIEL_AGENT_NAME: ciel-task-bench
      CIEL_AGENT_PORT: '8092'
      CIEL_MODEL: pipeline
      CIEL_VOICE: irodori
      CIEL_INPUT: text
      CIEL_BENCHMARK: '1'
      CIEL_BENCH_DISTRACTORS: ${CIEL_BENCH_DISTRACTORS:-0}
      CIEL_BENCH_DISTRACTOR_SURFACE: ${CIEL_BENCH_DISTRACTOR_SURFACE:-both}
      CIEL_BENCH_MODEL_ID: ${CIEL_BENCH_MODEL_ID:?Set the exact evaluated model / checkpoint label}
      CIEL_LLM_BACKEND: ${CIEL_BENCH_BACKEND:-local}
      CIEL_LOCAL_LLM_URL: ${CIEL_BENCH_LLM_URL:-http://127.0.0.1:8094/v1}
      CIEL_LOCAL_LLM_MODEL: ${CIEL_BENCH_LOCAL_MODEL:-local}
      CIEL_LOCAL_TIMEOUT: ${CIEL_BENCH_LOCAL_TIMEOUT:-600}
      CIEL_LOCAL_ROLES: ''
      CIEL_GAMES: minecraft=http://127.0.0.1:8773/mcp
      CIEL_DB_URL: ''
      CIEL_MINUTES_DISCORD_WEBHOOK: ''
      CIEL_DEBUG_LOG: '1'
      CIEL_AIZUCHI: '0'
      CIEL_NOD: '0'
    volumes:
      - ./agent/config:/app/config:ro
      - ./benchmark:/app/benchmark:ro
      - ./benchmark/data/debug:/app/data/debug
      - ./benchmark/data/minutes:/app/data/minutes
    depends_on:
      - body-bench
    restart: 'no'
