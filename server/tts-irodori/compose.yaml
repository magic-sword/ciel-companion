# シエルの声の読み上げサービス。自宅の GPU サーバーで、会話サーバーと同じマシンに置く。/data に参照音声とモデルのキャッシュ（Git の外）。
services:
  tts:
    build:
      context: .
      network: host
    network_mode: host
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
