      <path d="M17 54h30m-25-5-5 5 5 5m20-10 5 5-5 5" fill="none" stroke="#54aeb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-server" viewBox="0 0 64 64">
      <rect x="7" y="5" width="40" height="17" rx="4" fill="#fff" stroke="#7762b5" stroke-width="2.5"/>
      <rect x="7" y="26" width="40" height="17" rx="4" fill="#fff" stroke="#7762b5" stroke-width="2.5"/>
