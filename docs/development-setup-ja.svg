    <symbol id="icon-palette" viewBox="0 0 64 64"><path d="M33 5C-2 5-5 55 25 58c11 1 6-13 15-13h9C68 43 62 5 33 5Z" fill="#f4e7ff" stroke="#9166ad" stroke-width="3"/><circle cx="18" cy="23" r="5" fill="#76b5e7"/><circle cx="31" cy="15" r="5" fill="#e8a1ba"/><circle cx="45" cy="23" r="5" fill="#e7bd69"/><circle cx="16" cy="38" r="5" fill="#71bba7"/></symbol>
