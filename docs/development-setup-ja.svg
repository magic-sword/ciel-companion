  </defs>
  <rect width="1600" height="1400" fill="#f5f8fc"/>
  <text x="40" y="58" class="title">CIEL Companion ｜ クローンから始める開発環境構築</text>
  <text x="40" y="94" class="body">Windows ＋ VS Code ＋ Codex / Claude Code。図の番号に沿って、手順書のコマンドを実行する。</text>
  <text x="40" y="124" class="small">2026-10-19 ｜ 詳細・入手先・コピー用コマンド：docs/development-setup-ja.md ｜ 版はプロジェクトの固定値</text>

  <text x="40" y="166" class="section">全員 ｜ まずはコードを開き、編集できるようにする</text>
  <rect x="40" y="184" width="480" height="262" rx="14" class="card"/>
  <use href="#icon-device" x="58" y="205" width="56" height="56"/>
  <text x="128" y="237" class="heading">1 ツールをインストール</text>
  <text x="60" y="289" class="body">Git for Windows・Git LFS・VS Code</text>
  <text x="60" y="321" class="body">Unity 担当：Hub ＋ Editor 6000.6.4f1</text>
  <text x="60" y="353" class="small">サーバー担当：Python 3.11 または 3.12</text>
  <text x="60" y="383" class="small">Android / Docker は担当作業に応じて追加</text>
  <rect x="58" y="401" width="444" height="29" rx="7" fill="#e7f5ee"/>
  <text x="70" y="422" class="badge">確認：新しいターミナルで git --version</text>

  <rect x="560" y="184" width="480" height="262" rx="14" class="card"/>
  <use href="#icon-code" x="578" y="205" width="56" height="56"/>
  <text x="648" y="237" class="heading">2 クローンして取得</text>
  <text x="580" y="286" class="code">git lfs install</text>
  <text x="580" y="316" class="code">git clone …/ciel-companion.git</text>
  <text x="580" y="346" class="code">cd ciel-companion</text>
  <text x="580" y="376" class="code">git lfs pull</text>
  <rect x="578" y="401" width="444" height="29" rx="7" fill="#e7f5ee"/>
  <text x="590" y="422" class="badge">確認：LFS の取得完了・エラーなし</text>

  <rect x="1080" y="184" width="480" height="262" rx="14" class="card"/>
  <use href="#icon-ai" x="1098" y="205" width="56" height="56"/>
  <text x="1168" y="237" class="heading">3 VS Code と AI 拡張</text>
  <text x="1100" y="286" class="code">code .</text>
  <text x="1100" y="317" class="body">Ctrl+Shift+X → Unity / Python 拡張</text>
  <text x="1100" y="348" class="body">Codex（OpenAI）/ Claude Code（Anthropic）</text>
  <text x="1100" y="379" class="small">使う AI のパネルを開いてサインイン</text>
  <rect x="1098" y="401" width="444" height="29" rx="7" fill="#e7f5ee"/>
  <text x="1110" y="422" class="badge">確認：README を開き、AI に構成を質問できる</text>
  <path d="M520 310H560" class="arrow"/>
  <path d="M1040 310H1080" class="arrow"/>

  <text x="40" y="492" class="section">Unity 担当 ｜ 4 → 5 → 6 の順に進む</text>
  <text x="940" y="491" class="small">Python のテストから始める人は、3 の後に 8 へ</text>
  <rect x="30" y="505" width="1540" height="337" rx="18" fill="#eaf2ff"/>
  <rect x="40" y="516" width="480" height="314" rx="14" class="card"/>
  <use href="#icon-palette" x="58" y="537" width="56" height="56"/>
  <text x="128" y="571" class="heading">4 Live2D SDK を復元</text>
  <text x="60" y="622" class="body">公式配布：Cubism 5 SDK R5（URP）</text>
  <text x="60" y="654" class="body">Unity を閉じたまま PowerShell で実行</text>
  <text x="60" y="691" class="code">.\scripts\restore-cubism.ps1 &#96;</text>
  <text x="60" y="721" class="code">  -PackagePath '取得したパッケージ'</text>
  <text x="60" y="756" class="small">SDK は Git に含まれない。固定版を使う。</text>
  <rect x="58" y="784" width="444" height="29" rx="7" fill="#e7f5ee"/>
  <text x="70" y="805" class="badge">確認：Restored … assets and their GUIDs</text>

  <rect x="560" y="516" width="480" height="314" rx="14" class="card"/>
  <use href="#icon-server" x="578" y="537" width="56" height="56"/>
  <text x="648" y="571" class="heading">5 Unity を開いて検証</text>
  <text x="580" y="622" class="body">Hub → Add project from disk</text>
  <text x="580" y="654" class="body">選ぶ場所：ciel-companion/unity</text>
  <text x="580" y="686" class="body">初回インポート・パッケージ取得を待つ</text>
  <text x="580" y="718" class="body">CIEL → SDK → Configure and Validate</text>
  <text x="580" y="756" class="small">External Script Editor を VS Code に設定</text>
  <rect x="578" y="784" width="444" height="29" rx="7" fill="#e7f5ee"/>
  <text x="590" y="805" class="badge">確認：Console に CIEL_SDK_OK</text>

  <rect x="1080" y="516" width="480" height="314" rx="14" class="card"/>
  <use href="#icon-device" x="1098" y="537" width="56" height="56"/>
  <text x="1168" y="571" class="heading">6 表示できれば準備完了</text>
  <text x="1100" y="622" class="body">Assets/Scenes/SdkCheck.unity → Play</text>
  <text x="1100" y="654" class="body">Koharu の表示を確認（通信・録音なし）</text>
  <text x="1100" y="692" class="body">シエルの画面：Conversation.unity</text>
  <text x="1100" y="723" class="small">表示だけなら Connect On Start をオフ。</text>
  <text x="1100" y="753" class="small">この確認用の切り替えはコミットに混ぜない。</text>
  <rect x="1098" y="784" width="444" height="29" rx="7" fill="#e7f5ee"/>
  <text x="1110" y="805" class="badge">確認：モデルが表示され、コンパイルエラーなし</text>
  <path d="M520 670H560" class="arrow"/>
  <path d="M1040 670H1080" class="arrow"/>

  <text x="40" y="886" class="section">作業に合わせて追加 ｜ 音声会話と、サーバーのテストは別々に準備できる</text>
  <rect x="40" y="908" width="740" height="296" rx="14" fill="#fff3e6" stroke="#ead4b9"/>
  <use href="#icon-key" x="60" y="929" width="56" height="56"/>
  <text x="130" y="964" class="heading">7 音声会話を試す ｜ 管理者と接続先を確認</text>
  <text x="62" y="1011" class="body">管理者 → 開発用 Token Server ID・稼働中の agent / TTS</text>
  <text x="62" y="1044" class="body">Unity → Assets/Settings/LiveKitTokenSource.asset</text>
  <text x="62" y="1077" class="body">Development Token Server を選択 → Token Server Id を入力</text>
  <text x="62" y="1110" class="body">Conversation の Token Config に指定 → Play → マイクをオン</text>
  <rect x="60" y="1146" width="700" height="37" rx="8" fill="#fff"/>
  <text x="73" y="1171" class="badge">確認：シエルの声・口パク・表情が返る。API キーは Unity に入れない。</text>

  <rect x="820" y="908" width="740" height="296" rx="14" fill="#edf0ff" stroke="#d4d9ee"/>
  <use href="#icon-code" x="840" y="929" width="56" height="56"/>
  <text x="910" y="964" class="heading">8 サーバーの通常テスト ｜ API キー・GPU 不要</text>
  <text x="842" y="1011" class="code">py -3.11 -m venv .venv</text>
  <text x="842" y="1044" class="body">.venv の Python で requirements-test.txt を導入</text>
  <text x="842" y="1077" class="body">scripts/server/test-regression.ps1 を実行（手順書参照）</text>
  <text x="842" y="1110" class="small">DB 結合テストを行うときだけ Docker ＋ -Suite all を追加</text>
  <rect x="840" y="1146" width="700" height="37" rx="8" fill="#fff"/>
  <text x="853" y="1171" class="badge">確認：終了コード 0。レポートは .local/regression/ に出力。</text>

  <rect x="40" y="1230" width="1520" height="122" rx="14" fill="#e7f5ee"/>
  <use href="#icon-code" x="60" y="1250" width="48" height="48"/>
  <text x="123" y="1282" class="heading">9 小さい修正から始める → 差分確認 → 検証 → ビルド・反映手順へ</text>
  <text x="62" y="1322" class="body">git switch -c onboarding/first-change ｜ server/agent の編集前に AGENTS.md を確認 ｜ 反映コマンドは初回セットアップでは実行しない</text>
  <text x="40" y="1381" class="small">青：アプリの表示まで ｜ オレンジ：管理者の接続設定が必要 ｜ 紫：ローカルのサーバーテスト ｜ インストール・認証の一連の手順はクリーン環境では未検証</text>
</svg>
