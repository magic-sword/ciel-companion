<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc">
  <title id="title">CIEL Companion クローンから始める開発環境構築</title>
  <desc id="desc">WindowsとVS Codeを使う初回セットアップ。共通準備、Git LFSとクローン、CodexとClaude Codeの拡張導入を行い、Unity担当はSDK復元、プロジェクト導入、表示確認へ進む。音声会話は管理者の接続設定、サーバーの通常テストはPython仮想環境を準備する。</desc>
  <defs>
