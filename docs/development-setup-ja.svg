    <symbol id="icon-voice" viewBox="0 0 64 64"><path d="M6 25h11l15-12v38L17 39H6Z" fill="#e0d9f7" stroke="#7762b5" stroke-width="3" stroke-linejoin="round"/><path d="M41 23q9 9 0 18m8-26q16 17 0 34" fill="none" stroke="#7762b5" stroke-width="3" stroke-linecap="round"/></symbol>
