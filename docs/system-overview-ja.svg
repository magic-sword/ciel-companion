<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290" role="img" aria-labelledby="title desc">
  <title id="title">CIEL Companion システム構成と開発環境</title>
  <desc id="desc">UnityアプリがLiveKit Cloud経由で自宅の会話サーバーへ接続する。会話サーバーはOpenAIで応答を生成し、Irodori-TTSで音声化する。人物記憶はPostgreSQLへ保存。下段に開発環境と制作・反映の流れを示す。</desc>
