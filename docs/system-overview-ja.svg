  <rect width="1600" height="1290" fill="#f5f8fc"/>
  <text x="40" y="58" class="title">CIEL Companion ｜ システム構成と開発環境</text>
  <text x="40" y="92" class="subtitle">日本語で話す Live2D キャラクター。表示は Unity、通信は LiveKit、会話は OpenAI、声は自宅 GPU。</text>
  <text x="40" y="123" class="small">2026-10-19 ｜ リポジトリの既定構成と運用ドキュメントに基づく。モデル名はコードの既定値。</text>

  <rect x="30" y="153" width="340" height="699" rx="16" fill="#eaf2ff"/>
  <rect x="410" y="153" width="300" height="699" rx="16" fill="#e8f5f6"/>
  <rect x="750" y="153" width="460" height="699" rx="16" fill="#edf0ff"/>
  <rect x="1250" y="153" width="320" height="699" rx="16" fill="#fff3e6"/>
  <text x="50" y="188" class="heading">利用者の端末</text>
  <text x="430" y="188" class="heading">外部の通信基盤</text>
  <text x="770" y="188" class="heading">自宅サーバー</text>
  <text x="1270" y="188" class="heading">外部 API</text>
  <text x="50" y="215" class="small">Windows / Android（実機確認済み）</text>
  <text x="430" y="215" class="small">LiveKit Cloud</text>
  <text x="770" y="215" class="small">Docker Compose：agent / tts / db</text>
  <text x="1270" y="215" class="small">会話・文字処理・検索・通知</text>

  <use href="#icon-device" x="50" y="231" width="76" height="76"/>
  <text x="140" y="261" class="heading">表示する・話す</text>
  <text x="140" y="290" class="small">キャラクターとの接点</text>
  <use href="#icon-cloud" x="430" y="231" width="76" height="76"/>
  <text x="518" y="261" class="heading">中継する</text>
  <text x="518" y="290" class="small">音声と操作を届ける</text>
  <use href="#icon-server" x="770" y="231" width="76" height="76"/>
  <text x="860" y="261" class="heading">会話と記憶をつなぐ</text>
  <text x="860" y="290" class="small">自宅の CPU・GPU で動作</text>
  <use href="#icon-ai" x="1270" y="231" width="76" height="76"/>
  <text x="1358" y="261" class="heading">考える・調べる</text>
  <text x="1358" y="290" class="small">生成 AI と外部サービス</text>
  <g transform="translate(0 90)">
  <rect x="50" y="245" width="300" height="78" rx="10" class="card"/>
  <use href="#icon-key" x="66" y="249" width="29" height="29"/><text x="103" y="273" class="heading" style="font-size:20px">① 接続設定</text>
  <text x="66" y="300" class="body">短期トークンを取得</text>
  <rect x="430" y="245" width="260" height="78" rx="10" class="card"/>
  <use href="#icon-key" x="446" y="250" width="29" height="29"/><text x="483" y="274" class="heading" style="font-size:19px">開発用トークン発行</text>
  <text x="446" y="300" class="small">公開前に認証つき発行へ移行</text>
  <path d="M350 284H430" class="line"/>

  <rect x="50" y="360" width="300" height="195" rx="10" class="card"/>
  <use href="#icon-device" x="66" y="370" width="29" height="29"/><text x="103" y="394" class="heading" style="font-size:20px">Unity アプリ / C#</text>
  <text x="66" y="426" class="body">Live2D 表示・口パク・表情</text>
  <text x="66" y="455" class="body">マイク入力・返答音声の再生</text>
  <text x="66" y="484" class="body">タッチ・会話モード・調査表示</text>
  <text x="66" y="531" class="small">unity/Assets/Scripts/Conversation/</text>
  <rect x="430" y="360" width="260" height="195" rx="10" class="card"/>
  <use href="#icon-cloud" x="446" y="370" width="29" height="29"/><text x="483" y="394" class="heading" style="font-size:19px">② LiveKit ルーム</text>
  <text x="446" y="426" class="body">音声：WebRTC</text>
  <text x="446" y="455" class="body">操作・表情・調査：JSON</text>
  <text x="446" y="491" class="small">アプリと agent を中継</text>
  <text x="446" y="520" class="small">LiveKit の録音は無効</text>
  <path d="M350 442H430" class="line both"/>
  <path d="M690 442H770" class="line both"/>

  <rect x="770" y="245" width="420" height="310" rx="10" class="card"/>
  <use href="#icon-server" x="788" y="255" width="29" height="29"/><text x="825" y="279" class="heading" style="font-size:20px">③ 会話サーバー / Python 3.11</text>
  <text x="788" y="307" class="small">server/agent/ ｜ LiveKit Agents 1.8.3</text>
  <text x="788" y="341" class="body">声を送る → 返答テキスト → 音声化</text>
  <text x="788" y="373" class="body">話者識別：SpeechBrain ECAPA（CPU）</text>
  <text x="788" y="405" class="body">function calling：人物・メモ・議事録・検索</text>
  <text x="788" y="452" class="body">接続中のメモリー</text>
  <text x="788" y="481" class="small">共通会話履歴・調査結果（切断で終了）</text>
  <text x="788" y="526" class="small">人物像・指示：config/persona.toml + prompts/*.md</text>

  <rect x="1270" y="245" width="280" height="172" rx="10" class="card"/>
  <use href="#icon-ai" x="1286" y="253" width="29" height="29"/><text x="1323" y="277" class="heading" style="font-size:20px">④ OpenAI Realtime</text>
  <text x="1286" y="308" class="body">gpt-realtime-2.1-mini</text>
  <text x="1286" y="337" class="body">音声入力 → 文字で返答</text>
  <text x="1286" y="367" class="small">入力の文字起こし：</text>
  <text x="1286" y="392" class="body">gpt-4o-mini-transcribe</text>
  <path d="M1190 330H1270" class="line both"/>
  <rect x="1270" y="440" width="280" height="185" rx="10" class="card"/>
  <use href="#icon-search" x="1286" y="448" width="29" height="29"/><text x="1323" y="472" class="heading" style="font-size:19px">OpenAI 文字処理・検索</text>
  <text x="1286" y="503" class="body">Chat Completions API</text>
  <text x="1286" y="531" class="small">人物メモ・関係：gpt-5.4-mini</text>
  <text x="1286" y="557" class="small">議事録：gpt-5.4</text>
  <text x="1286" y="586" class="body">Responses API + web_search</text>
  <text x="1286" y="610" class="small">Web 調査：gpt-5.4-mini</text>
  <path d="M1190 498H1270" class="line both optional"/>

  <rect x="770" y="597" width="198" height="142" rx="10" class="card"/>
  <use href="#icon-voice" x="784" y="605" width="29" height="29"/><text x="821" y="629" class="heading" style="font-size:19px">⑤ Irodori-TTS</text>
  <text x="784" y="658" class="body">返答を 1 文ずつ合成</text>
  <text x="784" y="685" class="small">GPU / CUDA 12.8</text>
  <text x="784" y="714" class="small">HTTP :8766 /synthesize</text>
  <rect x="989" y="597" width="201" height="142" rx="10" class="card"/>
  <use href="#icon-db" x="1003" y="605" width="29" height="29"/><text x="1040" y="629" class="heading" style="font-size:19px">人物の長期記憶</text>
  <text x="1003" y="658" class="body">PostgreSQL 17</text>
  <text x="1003" y="685" class="small">pgvector 0.8.0 / :5433</text>
  <text x="1003" y="714" class="small">同意済みの声・メモ・関係</text>
  <path d="M865 555V597" class="line both"/>
  <path d="M1085 555V597" class="line both"/>

  <rect x="1270" y="658" width="280" height="81" rx="10" class="card"/>
  <use href="#icon-message" x="1286" y="665" width="29" height="29"/><text x="1323" y="689" class="heading" style="font-size:17px">Discord Webhook（任意）</text>
  <text x="1286" y="716" class="small">議事録の下書き → 非公開チャンネル</text>
  <path d="M1190 540H1230V698H1270" class="line optional"/>
  <rect x="50" y="597" width="300" height="142" rx="10" class="card"/>
  <use href="#icon-meeting" x="66" y="605" width="29" height="29"/><text x="103" y="629" class="heading" style="font-size:18px">会議参加（任意 / Windows）</text>
  <text x="66" y="660" class="body">Zoom / Meet ↔ 仮想ケーブル</text>
  <text x="66" y="688" class="body">アプリ画面 → OBS → 仮想カメラ</text>
  <text x="66" y="716" class="small">会議サービスの API 連携は使わない</text>
  <path d="M200 597V555" class="line both optional"/>
  <text x="430" y="605" class="label">実線：既定の会話・記憶の経路</text>
  <text x="430" y="635" class="label">破線：検索・議事録など必要時</text>
  <text x="430" y="684" class="small">返答の声は TTS → agent →</text>
  <text x="430" y="710" class="small">LiveKit → Unity へ戻る</text>

  <text x="40" y="805" class="heading">開発環境と、変更を届ける流れ</text>
  <rect x="40" y="828" width="480" height="170" rx="12" class="card"/>
  <use href="#icon-code" x="58" y="836" width="29" height="29"/><text x="95" y="860" class="heading" style="font-size:21px">アプリ開発 ｜ Windows</text>
  <text x="58" y="890" class="body">Unity Hub / Editor 6000.6.4f1 / URP 17.6.0</text>
  <text x="58" y="918" class="body">Cubism 5 SDK R5 / LiveKit Unity SDK 2.1.0</text>
  <text x="58" y="946" class="body">Unity CLI・PowerShell / Git Bash・Git LFS</text>
  <text x="58" y="978" class="small">unity/ → CIEL Build → Windows EXE / Android APK</text>
  <rect x="540" y="828" width="480" height="170" rx="12" class="card"/>
  <use href="#icon-server" x="558" y="836" width="29" height="29"/><text x="595" y="860" class="heading" style="font-size:21px">サーバー開発と反映</text>
  <text x="558" y="890" class="body">Python 3.11 / unittest / PostgreSQL 結合テスト</text>
  <text x="558" y="918" class="body">server/ → deploy-server → SSH・SCP・tar</text>
  <text x="558" y="946" class="body">→ 自宅サーバー → Docker Compose で再構築</text>
  <text x="558" y="978" class="small">GPU：NVIDIA RTX A2000 12GB（既存運用資料）</text>
  <rect x="1040" y="828" width="520" height="170" rx="12" class="card"/>
  <use href="#icon-palette" x="1058" y="836" width="29" height="29"/><text x="1095" y="860" class="heading" style="font-size:21px">Live2D 制作と組み込み</text>
  <text x="1058" y="890" class="body">assets/ciel/current/ の素材 → Cubism 編集</text>
  <text x="1058" y="918" class="body">→ rig/ciel.cmo3 → runtime/ の SDK 用データ</text>
  <text x="1058" y="946" class="body">→ Unity「Model / Apply Current Package」</text>
  <text x="1058" y="978" class="small">ハッシュ検証 → unity/Assets/Characters/Ciel/ に反映</text>

  <rect x="40" y="1019" width="1520" height="143" rx="12" fill="#e7edf5"/>
  <use href="#icon-lock" x="58" y="1027" width="29" height="29"/><text x="95" y="1051" class="heading" style="font-size:21px">参加時に押さえる設定と実装状況</text>
  <text x="58" y="1082" class="body">秘密情報：server/agent/.env（OpenAI・LiveKit・Discord）、server/.env（DB）。API キーを Unity に入れない。</text>
  <text x="58" y="1111" class="body">TTS・DB はサーバー内の 127.0.0.1。外部サービスへの接続はサーバー側から開始する。</text>
  <text x="58" y="1140" class="small">予備：Seed-VC / :8765（通常停止） ｜ 複数端末の独立会話・共有記憶対策：実装済み、本番未反映 ｜ iOS：未検証</text>
  <text x="40" y="1187" class="small">詳細・根拠：docs/architecture-ja.md ｜ 起動・ビルド：docs/build-ja.md ｜ 外部仕様の最新版や本番稼働状況の再確認は含まない</text>
  </g>
</svg>
