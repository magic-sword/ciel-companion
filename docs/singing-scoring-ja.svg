<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc">
  <title id="title">シエルが歌を聴く仕組みと、ときめき度の内わけ</title>
  <desc id="desc">上段：歌声はアプリから会話サーバーへ届き、自宅 GPU の歌を聴くサービスで分析される。OpenAI には文字の手がかりだけを渡す。中段：歌っている途中は 5 秒ごとにメーター・ハート・ひとことを出し、歌い終わったら結果のカードと声の感想を返す。下段：ときめき度は聴かせてくれた点 40 に、響き 25、ぐっときた瞬間 15、表現 12、伸び 8 を足した 100 点満点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4274c6"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#d9467e"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a97a8"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #24364f; }
    .h1 { font-size: 30px; font-weight: 700; }
    .h2 { font-size: 21px; font-weight: 700; fill: #2f5aa8; }
    .box-title { font-size: 18px; font-weight: 700; }
    .t { font-size: 15px; }
    .s { font-size: 13px; fill: #4c5d74; }
    .xs { font-size: 12px; fill: #5c6b80; }
    .pink { fill: #c2336e; }
    .num { font-size: 26px; font-weight: 700; }
    .white { fill: #ffffff; }
  </style>

  <rect width="1400" height="1060" fill="#f7f9fc"/>
  <text x="40" y="52" class="h1">シエルが歌を聴く仕組み</text>
  <text x="40" y="82" class="s">正しさの採点ではなく、「シエルの心に響いたか」で聴く。歌声は自宅の外へ出さない。</text>

  <!-- ① 歌声の流れ -->
  <text x="40" y="128" class="h2">① 歌声の行き先</text>
  <rect x="30" y="140" width="1340" height="250" rx="16" fill="#ffffff" stroke="#d5dfee"/>

  <!-- アプリ -->
  <rect x="60" y="180" width="200" height="150" rx="14" fill="#eef4ff" stroke="#4274c6" stroke-width="2"/>
  <text x="160" y="212" text-anchor="middle" class="box-title">アプリ</text>
  <text x="160" y="240" text-anchor="middle" class="s">マイクで歌を録る</text>
  <text x="160" y="262" text-anchor="middle" class="s">メーター・♡・ひとこと</text>
  <text x="160" y="284" text-anchor="middle" class="s">結果のカード</text>
  <text x="160" y="312" text-anchor="middle" class="xs">（Windows・Android）</text>

  <!-- 会話サーバー -->
  <rect x="380" y="180" width="270" height="150" rx="14" fill="#eef4ff" stroke="#4274c6" stroke-width="2"/>
  <text x="515" y="212" text-anchor="middle" class="box-title">会話サーバー</text>
  <text x="515" y="240" text-anchor="middle" class="s">歌っている間は OpenAI へ</text>
  <text x="515" y="260" text-anchor="middle" class="s">声を送らず、メモリーにためる</text>
  <text x="515" y="286" text-anchor="middle" class="s">手がかりを文字にする</text>
  <text x="515" y="312" text-anchor="middle" class="xs">server/agent/singing.py</text>

  <!-- 歌を聴くサービス -->
  <rect x="770" y="170" width="300" height="170" rx="14" fill="#fff3f8" stroke="#d9467e" stroke-width="2"/>
  <text x="920" y="202" text-anchor="middle" class="box-title">歌を聴くサービス（自宅 GPU）</text>
  <text x="920" y="230" text-anchor="middle" class="s">Audiobox Aesthetics … 心に響いた度</text>
  <text x="920" y="252" text-anchor="middle" class="s">MERT … 展開の変化</text>
  <text x="920" y="274" text-anchor="middle" class="s">CREPE … 音の高さ・くせ・揺れ</text>
  <text x="920" y="296" text-anchor="middle" class="s">音量 … 盛り上がり・強弱</text>
  <text x="920" y="324" text-anchor="middle" class="xs">server/singing</text>

  <!-- OpenAI -->
  <rect x="1150" y="180" width="190" height="150" rx="14" fill="#f2f3f5" stroke="#8a97a8" stroke-width="2"/>
  <text x="1245" y="212" text-anchor="middle" class="box-title">OpenAI</text>
  <text x="1245" y="240" text-anchor="middle" class="s">文字の手がかりから</text>
  <text x="1245" y="262" text-anchor="middle" class="s">シエルの言葉で</text>
  <text x="1245" y="284" text-anchor="middle" class="s">感想を作る</text>
  <text x="1245" y="312" text-anchor="middle" class="xs">（歌声は届かない）</text>

  <!-- 矢印 -->
  <path d="M262 235H376" stroke="#4274c6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="319" y="225" text-anchor="middle" class="xs">歌声</text>
  <path d="M652 235H766" stroke="#d9467e" stroke-width="3" marker-end="url(#arrow-pink)"/>
  <text x="709" y="225" text-anchor="middle" class="xs">歌声</text>
  <path d="M766 285H654" stroke="#d9467e" stroke-width="3" marker-end="url(#arrow-pink)"/>
  <text x="709" y="305" text-anchor="middle" class="xs">手がかり</text>
  <path d="M652 205C800 150 1050 150 1180 176" fill="none" stroke="#8a97a8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-gray)"/>
  <text x="915" y="158" text-anchor="middle" class="xs">文字の手がかりだけ</text>
  <path d="M376 290H262" stroke="#4274c6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="319" y="310" text-anchor="middle" class="xs">知らせ・声</text>
  <rect x="380" y="350" width="690" height="28" rx="8" fill="#fff8e6" stroke="#e9c46a"/>
  <text x="725" y="369" text-anchor="middle" class="s">歌声はファイル・ログ・DB に残さず、分析に渡したら捨てる。外部の AI には送らない。</text>

  <!-- ② 時間の流れ -->
  <text x="40" y="440" class="h2">② 歌の前・途中・あと</text>
  <rect x="30" y="452" width="1340" height="230" rx="16" fill="#ffffff" stroke="#d5dfee"/>
  <!-- 時間軸 -->
  <path d="M70 520H1330" stroke="#b9c6da" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="150" cy="520" r="9" fill="#4274c6"/>
  <circle cx="330" cy="520" r="9" fill="#4274c6"/>
  <circle cx="900" cy="520" r="9" fill="#d9467e"/>
  <circle cx="1120" cy="520" r="9" fill="#d9467e"/>
  <text x="150" y="500" text-anchor="middle" class="t">「歌を聴いて」</text>
  <text x="330" y="500" text-anchor="middle" class="t">「どうぞ！」</text>
  <text x="900" y="500" text-anchor="middle" class="t">歌い終わり</text>
  <text x="1120" y="500" text-anchor="middle" class="t">感想</text>
  <!-- 歌っている区間 -->
  <rect x="345" y="540" width="540" height="122" rx="12" fill="#fff3f8" stroke="#f0b6cc"/>
  <text x="615" y="566" text-anchor="middle" class="box-title pink">歌っている途中（5 秒ごとに直近 10 秒）</text>
  <text x="365" y="594" class="s">・ときめきメーター：心に響いた度で溜まる</text>
  <text x="365" y="616" class="s">・満タンで ♡ がはずみ、シエルがわくわく → 0 から溜め直す</text>
  <text x="365" y="638" class="s">・吹き出しのひとこと（決まった文。12 秒より間をあける）</text>
  <text x="365" y="656" class="xs">シエルは声を出さない（マイクに入る・歌の邪魔になる）</text>
  <!-- 前 -->
  <rect x="70" y="540" width="260" height="122" rx="12" fill="#eef4ff" stroke="#c4d6f3"/>
  <text x="200" y="566" text-anchor="middle" class="box-title">歌の前</text>
  <text x="88" y="594" class="s">・道具を呼んだ返事の前置きは</text>
  <text x="100" y="614" class="s">読み上げ中の 1 文で止める</text>
  <text x="88" y="638" class="s">・「どうぞ」のあとから録る</text>
  <!-- あと -->
  <rect x="900" y="540" width="450" height="122" rx="12" fill="#fff3f8" stroke="#f0b6cc"/>
  <text x="1125" y="566" text-anchor="middle" class="box-title pink">歌い終わったら</text>
  <text x="918" y="594" class="s">・終わり：札をタップ／8 秒静か／10 分</text>
  <text x="918" y="616" class="s">・歌全体を分析（4 分の歌で約 11 秒）</text>
  <text x="918" y="638" class="s">・結果のカード → シエルが声で感想（3〜5 文）</text>
  <text x="918" y="656" class="xs">感想を話し終えたら、歌の前の考えを捨てる</text>

  <!-- ③ ときめき度 -->
  <text x="40" y="730" class="h2">③ ときめき度（100 点）の内わけ</text>
  <rect x="30" y="742" width="1340" height="290" rx="16" fill="#ffffff" stroke="#d5dfee"/>
  <!-- 帯：40 + 25 + 15 + 12 + 8 = 100、幅 1200 → 1 点 12px -->
  <rect x="80" y="780" width="480" height="64" rx="10" fill="#c9d3e3"/>
  <rect x="560" y="780" width="300" height="64" fill="#f28db5"/>
  <rect x="860" y="780" width="180" height="64" fill="#f6aecb"/>
  <rect x="1040" y="780" width="144" height="64" fill="#9cc6f2"/>
  <rect x="1184" y="780" width="96" height="64" rx="10" fill="#9fe0c9"/>
  <rect x="1176" y="780" width="12" height="64" fill="#9fe0c9"/>
  <text x="320" y="808" text-anchor="middle" class="num">40</text>
  <text x="320" y="832" text-anchor="middle" class="s">聴かせてくれた点</text>
  <text x="710" y="808" text-anchor="middle" class="num white">25</text>
  <text x="710" y="832" text-anchor="middle" class="s white">響き</text>
  <text x="950" y="808" text-anchor="middle" class="num">15</text>
  <text x="950" y="832" text-anchor="middle" class="s">ぐっときた瞬間</text>
  <text x="1112" y="808" text-anchor="middle" class="num">12</text>
  <text x="1112" y="832" text-anchor="middle" class="s">表現</text>
  <text x="1232" y="808" text-anchor="middle" class="num">8</text>
  <text x="1232" y="832" text-anchor="middle" class="s">伸び</text>
  <!-- 説明 -->
  <text x="80" y="878" class="t">・いつもある点。正しさで減らす点は無い</text>
  <text x="80" y="900" class="xs">（シエルの主観の点数。専門家どうしでも点数はばらつくため）</text>
  <text x="560" y="878" class="t">響き：いちばん響いた 10 秒の高さ</text>
  <text x="560" y="900" class="xs">心に響いた度 3 → 0 点、7 → 25 点（仮の目盛り）</text>
  <text x="560" y="930" class="t">ぐっときた瞬間：重なった理由の数</text>
  <text x="560" y="952" class="xs">響いた・盛り上がり・展開の変化（最大 3 か所）。理由 6 つで満点</text>
  <text x="1000" y="878" class="t">表現：強弱の幅、盛り上がりや</text>
  <text x="1000" y="900" class="t">展開の変化、くせ（2 つまで）</text>
  <text x="1000" y="930" class="t">伸び：揺れなかった伸ばす音の割合</text>
  <text x="1000" y="952" class="xs">伸ばす音が無ければ半分（4 点）</text>
  <rect x="80" y="972" width="1200" height="44" rx="10" fill="#f7f9fc" stroke="#d5dfee"/>
  <text x="100" y="1000" class="s">例（合成した歌声もどき 4 分 17 秒、自宅サーバー）：40 ＋ 響き 12 ＋ ぐっときた瞬間 15 ＋ 表現 8 ＋ 伸び 8 ＝ 83 点</text>
</svg>
